<section id="inicio" class="hero" aria-labelledby="hero-title">
  <div class="hero__aura" aria-hidden="true"></div>

  <div class="hero__title-wrap">
    <h1 id="hero-title" class="hero__title hero-heading">
      <span>{{ locale.text('Hola, soy') }}</span>
      <span class="hero__name">Nicolás</span>
    </h1>
  </div>

  <figure class="hero__portrait" [attr.aria-label]="locale.text('Retrato de Nicolás Alarcón Guzmán')">
    <div class="hero__portrait-frame">
      <img
        src="/assets/images/nicolas-hero-cutout-v2-1100.webp"
        srcset="
          /assets/images/nicolas-hero-cutout-v2-720.webp   720w,
          /assets/images/nicolas-hero-cutout-v2-1100.webp 1100w
        "
        sizes="
          (max-width: 640px) and (max-height: 720px) min(48vw, 192px),
          (max-width: 390px) min(49.6vw, 196px),
          (max-width: 640px) min(51.2vw, 208px),
          (max-width: 900px) clamp(200px, 30.4vw, 272px),
          400px
        "
        width="1100"
        height="1375"
        [alt]="locale.text('Retrato de Nicolás Alarcón Guzmán')"
        fetchpriority="high"
      />
    </div>
  </figure>

  <div class="hero__bottom">
    <div class="hero__intro">
      <span>{{ locale.text(profile.role) }} · {{ profile.headline }}</span>
      <p>{{ locale.text(profile.summary) }}</p>
    </div>

    <div class="hero__actions" [attr.aria-label]="locale.text('Acciones principales')">
      <a class="button" href="#contacto">{{ locale.text('Contactarme') }}</a>
      <a class="button button--ghost" [href]="locale.cvUrl()" download>{{ locale.text('Descargar CV') }}</a>
    </div>
  </div>

  <a class="hero__scroll" href="#skills" [attr.aria-label]="locale.text('Ir al stack técnico')">
    <span>{{ locale.text('Desplazar') }}</span>
    <i aria-hidden="true"></i>
  </a>
</section>
