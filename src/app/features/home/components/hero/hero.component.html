<section id="inicio" class="hero" aria-labelledby="hero-title">
  <div class="hero__aura" aria-hidden="true"></div>

  <div class="hero__title-wrap">
    <h1 id="hero-title" class="hero__title hero-heading">
      <span>Hola, soy</span>
      <span>Nicolás</span>
    </h1>
  </div>

  <figure class="hero__portrait" aria-label="Retrato de Nicolás Alarcón Guzmán">
    <div class="hero__portrait-frame">
      <img
        src="/assets/images/nicolas-hero-atelier-1100.jpg"
        srcset="/assets/images/nicolas-hero-atelier-720.jpg 720w, /assets/images/nicolas-hero-atelier-1100.jpg 1100w"
        sizes="(max-width: 640px) 86vw, (max-width: 1100px) 50vw, 500px"
        width="1100"
        height="1375"
        alt="Retrato editorial de Nicolás Alarcón Guzmán, Frontend Developer"
        fetchpriority="high"
      >
    </div>
  </figure>

  <div class="hero__bottom">
    <div class="hero__intro">
      <span>Frontend Developer · Angular · TypeScript · E2E</span>
      <p>{{ profile.summary }}</p>
    </div>

    <div class="hero__actions" aria-label="Acciones principales">
      <a class="button" href="#contacto">Contactarme</a>
      <a class="button button--ghost" [href]="profile.cvUrl" download>Descargar CV</a>
    </div>
  </div>

  <a class="hero__scroll" href="#skills" aria-label="Ir al stack técnico">
    <span>Scroll</span>
    <i aria-hidden="true"></i>
  </a>
</section>
