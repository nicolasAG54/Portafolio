<section class="value" aria-labelledby="value-title">
  <div class="container value__inner">
    <div class="value__copy">
      <h2 id="value-title">Frontend con criterio, no solo con código.</h2>
      <p>
        Entiendo requerimientos de negocio, cuido la experiencia del usuario y dejo una base que
        otros desarrolladores pueden mantener.
      </p>
    </div>

    <ol>
      @for (point of valuePoints; track point; let index = $index) {
        <li>
          <span>0{{ index + 1 }}</span>
          <strong>{{ point }}</strong>
        </li>
      }
    </ol>
  </div>
</section>
