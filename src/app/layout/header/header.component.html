<header class="site-header">
  <nav class="nav" aria-label="Navegación principal">
    <a class="brand" href="#inicio" (click)="closeMenu()" aria-label="Ir al inicio">
      <span class="brand__mark" aria-hidden="true">
        <img src="/assets/images/nicolas-avatar.webp" width="192" height="192" alt="" />
      </span>
      <span class="brand__copy">
        <strong>{{ profile.shortName }}</strong>
        <small>Frontend Developer</small>
      </span>
    </a>

    <button
      class="menu-button"
      type="button"
      aria-label="Abrir o cerrar navegación"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="main-menu"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
    </button>

    <div id="main-menu" class="nav__links" [class.nav__links--open]="isMenuOpen()">
      @for (item of navItems; track item.fragment) {
        <a [href]="'#' + item.fragment" (click)="closeMenu()">{{ item.label }}</a>
      }
    </div>

    <a class="nav__cv" [href]="profile.cvUrl" download>Descargar CV</a>
  </nav>
</header>
