<header class="site-header">
  <nav class="nav" [attr.aria-label]="locale.text('Navegación principal')">
    <a class="brand" href="#inicio" (click)="closeMenu()" [attr.aria-label]="locale.text('Ir al inicio')">
      <span class="brand__mark" aria-hidden="true">
        <img src="/assets/images/nicolas-avatar.webp" width="192" height="192" alt="" />
      </span>
      <span class="brand__copy">
        <strong>{{ profile.shortName }}</strong>
        <small>Frontend Developer</small>
      </span>
    </a>

    <button
      class="menu-button"
      type="button"
      [attr.aria-label]="locale.text('Abrir o cerrar navegación')"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="main-menu"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
    </button>

    <div id="main-menu" class="nav__links" [class.nav__links--open]="isMenuOpen()">
      @for (item of navItems; track item.fragment) {
        <a
          [href]="'#' + item.fragment"
          [class.nav__link--featured]="item.fragment === 'proyectos'"
          (click)="closeMenu()"
        >
          {{ locale.text(item.label) }}
          @if (item.fragment === 'proyectos') {
            <small aria-hidden="true">07</small>
          }
        </a>
      }
    </div>

    <div class="nav__actions">
      <button
        class="nav__language"
        type="button"
        [attr.aria-label]="locale.isEnglish() ? 'Cambiar a español' : 'Switch to English'"
        [attr.lang]="locale.isEnglish() ? 'es' : 'en'"
        (click)="locale.toggle()"
      >
        <img
          class="nav__flag"
          [src]="locale.isEnglish() ? '/assets/flags/co.svg' : '/assets/flags/us.svg'"
          alt=""
          width="20"
          height="14"
        />
        {{ locale.isEnglish() ? 'ES' : 'EN' }}
      </button>
      <a class="nav__cv" [href]="locale.cvUrl()" download>{{ locale.text('Descargar CV') }}</a>
    </div>
  </nav>
</header>
