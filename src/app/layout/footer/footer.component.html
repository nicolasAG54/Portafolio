<footer class="footer">
  <div class="container footer__top">
    <a class="footer__brand" href="#inicio" aria-label="Volver al inicio">
      <span>NA</span>
      <strong>{{ profile.name }}</strong>
    </a>

    <nav aria-label="Enlaces rápidos">
      @for (item of navItems; track item.fragment) {
        <a [href]="'#' + item.fragment">{{ item.label }}</a>
      }
    </nav>

    <a class="footer__email" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
  </div>

  <div class="container footer__bottom">
    <span>© {{ year }} {{ profile.name }}</span>
    <span>Angular · TypeScript · Colombia</span>
  </div>
</footer>
